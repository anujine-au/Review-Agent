# CI: Review Agent-ийн ажлын урсгалын тест (Node.js, гадны сангүй).
# Бодит тайлан, хэрэглэгч, SMTP тохиргоо repo-д байхгүй — тест түр хавтсанд өөрийн өгөгдлөө үүсгэнэ.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/workflow.test.js
